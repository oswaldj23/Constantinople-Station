id: treasury
name: TREASURY
agents: [VAULT]
cadence_seconds: 900           # collect receipts every 15 min
steps:
  - {id: collect,   name: Collect,     kind: tool, tool: etsy.poll_receipts}
  - {id: record,    name: Reconcile,   kind: tool, tool: treasury.record_sales, args: {sales_from: collect.sales, bay: etsy}}
  - {id: mirror,    name: Cost mirror, kind: tool, tool: treasury.reconcile}
